            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #0a0f1a;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3);
        }
        .login-error {
            color: #e74c3c;
            margin-top: 15px;

        #app {

        }
        ::-webkit-scrollbar-track {

        @media (max-width: 768px) {
            .sidebar {
                width: 75px;
                padding: 10px;
            }
            .sidebar .brand h2,
            .sidebar .brand small,
            .sidebar .user-info div,
            .sidebar .menu .menu-item span {
                display: none;
            }
            .sidebar .menu .menu-item {
                justify-content: center;
                padding: 15px;
            }
            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="loginPage">
        <div class="login-box">
            <div class="logo"><i class="fas fa-oil-can"></i></div>
            <h1>أبوالسعود <span>علام</span></h1>
            <p style="color:rgba(255,255,255,0.4);">نظام الشركة المتكامل v6.1</p>
            <input type="text" id="loginUser" placeholder="اسم المستخدم">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button onclick="handleLogin()"><i class="fas fa-key"></i> دخول</button>
            <div id="loginError" class="login-error">❌ بيانات الدخول غير صحيحة</div>

    <!-- التطبيق -->
    <div id="app">

                    <h2><i class="fas fa-oil-can"></i> أبوالسعود</h2>

                </div>

                    <i class="fas fa-user-cog"></i>
                    <div><div class="name" id="displayName">Admin</div><div class="role" id="displayRole">مدير</div></div>
                </div>

                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></button>
            </aside>
            <main class="main-content" id="mainContent"></main>
        </div>
    </div>

    <!-- منطقة الطباعة -->
    <div id="receiptArea">
        <div style="text-align:center; border-bottom:2px dashed #ccc; padding-bottom:10px;">
            <h2 style="color:#000;">أبوالسعود علام للزيوت</h2>
            <p>فاتورة بيع رقم: <span id="rInvoiceNo"></span></p>

        </div>
        <div style="padding:10px 0;"><p><strong>العميل:</strong> <span id="rCustomer"></span> - <span id="rPhone"></span></p></div>
        <table style="width:100%; border-collapse:collapse; margin:10px 0; color:#000;">
            <thead><tr style="background:#eee;"><th>كود الصنف</th><th>نوع الزيت</th><th>الحجم</th><th>السعر</th><th>الإجمالي</th></tr></thead>
            <tbody id="rItems"></tbody>
        </table>
        <div style="border-top:2px dashed #ccc; padding-top:10px;">
            <div class="flex-between"><span>الإجمالي</span><span id="rTotalBefore"></span></div>
            <div class="flex-between"><span>الخصم</span><span id="rDiscount"></span></div>

        </div>
        <div style="text-align:center; margin-top:20px; font-size:12px; color:#888;">شكراً لتعاملكم</div>
        <hr style="margin:15px 0; border:1px dashed #ccc;">
        <div style="text-align:center; font-size:12px; color:#888;">نسخة المحاسب</div>
    </div>

    <script>
        // ================================================================
        // 1. قاعدة البيانات
        // ================================================================
        function getDB() {
            let db = localStorage.getItem('AbuSaudOilDB_v6');
            if (!db) {
                const init = {
                    users: [
                        { id: 1, name: 'صاحب الشركة', username: 'abo elsood', password: 'admin@2026', role: 'admin',
                            salary: 0, advances: 0, absences: 0 },
                        { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                            salary: 3000, advances: 0, absences: 0 }
                    ],
                    regularEmployees: [
                        { id: 1, name: 'محمد سيد', salary: 2500, advances: 0, absences: 0 },
                        { id: 2, name: 'أحمد علي', salary: 2000, advances: 0, absences: 0 }
                    ],
                    products: [
                        { id: 1, code: 'OIL-001', name: 'زيت موتور 20W-50', costPrice: 80, sellPrice: 120,
                            qty_main: 50, qty_matriya: 20 },
                        { id: 2, code: 'OIL-002', name: 'زيت جير 80W-90', costPrice: 60, sellPrice: 90,
                            qty_main: 30, qty_matriya: 10 },
                        { id: 3, code: 'OIL-003', name: 'زيت فرامل DOT4', costPrice: 50, sellPrice: 75,
                            qty_main: 15, qty_matriya: 5 }
                    ],
                    customers: [{ id: 1, name: 'محل السيارات الحديثة', phone: '01001234567', balance: 0 }],
                    suppliers: [{ id: 1, name: 'مصنع الزيوت المصرية', phone: '01009876543', balance: 0 }],
                    sales: [],
                    purchases: [],
                    transfers: [],
                    expenses: [],
                    cashbox: [{ id: 1, amount: 5000, date: new Date().toISOString().slice(0, 10),
                        description: 'رصيد افتتاحي' }],
                    bank: [{ id: 1, amount: 20000, date: new Date().toISOString().slice(0, 10),
                        description: 'رصيد افتتاحي' }],
                    capital: { capitalAmount: 100000, setupCost: 15000, startDate: new Date().toISOString().slice(0,
                            10) },
                    nextSaleId: 1,
                    nextPurchaseId: 1,
                    nextTransferId: 1,
                    nextExpId: 1,
                    nextCustId: 2,
                    nextSuppId: 2,
                    nextRegEmpId: 3
                };
                localStorage.setItem('AbuSaudOilDB_v6', JSON.stringify(init));
                return init;
            }
            try {
                return JSON.parse(db);
            } catch (error) {
                localStorage.removeItem('AbuSaudOilDB_v6');
                return getDB();
            }
        }

        function saveDB(db) { 
            localStorage.setItem('AbuSaudOilDB_v6', JSON.stringify(db)); 
        }

        function nextId(items) {
            return items.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
        }

        function asNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function todayString() {
            return new Date().toISOString().slice(0, 10);
        }

        function normalizeDB(data) {
            const normalized = data && typeof data === 'object' ? data : {};
            const today = todayString();

            if (!Array.isArray(normalized.users) || normalized.users.length === 0) {
                normalized.users = [
                    { id: 1, name: 'صاحب الشركة', username: 'abo elsood', password: 'admin@2026', role: 'admin',
                        salary: 0, advances: 0, absences: 0 },
                    { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                        salary: 3000, advances: 0, absences: 0 }
                ];
            }
            if (!Array.isArray(normalized.regularEmployees)) {
                normalized.regularEmployees = [
                    { id: 1, name: 'محمد سيد', salary: 2500, advances: 0, absences: 0 },
                    { id: 2, name: 'أحمد علي', salary: 2000, advances: 0, absences: 0 }
                ];
            }
            if (!Array.isArray(normalized.products)) {
                normalized.products = [
                    { id: 1, code: 'OIL-001', name: 'زيت موتور 20W-50', costPrice: 80, sellPrice: 120, qty_main: 50, qty_matriya: 20 },
                    { id: 2, code: 'OIL-002', name: 'زيت جير 80W-90', costPrice: 60, sellPrice: 90, qty_main: 30, qty_matriya: 10 },
                    { id: 3, code: 'OIL-003', name: 'زيت فرامل DOT4', costPrice: 50, sellPrice: 75, qty_main: 15, qty_matriya: 5 }
                ];
            }
            if (!Array.isArray(normalized.customers)) {
                normalized.customers = [{ id: 1, name: 'محل السيارات الحديثة', phone: '01001234567', balance: 0 }];
            }
            if (!Array.isArray(normalized.suppliers)) {
                normalized.suppliers = [{ id: 1, name: 'مصنع الزيوت المصرية', phone: '01009876543', balance: 0 }];
            }
            if (!Array.isArray(normalized.sales)) normalized.sales = [];
            if (!Array.isArray(normalized.purchases)) normalized.purchases = [];
            if (!Array.isArray(normalized.transfers)) normalized.transfers = [];
            if (!Array.isArray(normalized.expenses)) normalized.expenses = [];
            if (!Array.isArray(normalized.cashbox)) {
                normalized.cashbox = [{ id: 1, amount: 5000, date: today, description: 'رصيد افتتاحي' }];
            }
            if (!Array.isArray(normalized.bank)) {
                normalized.bank = [{ id: 1, amount: 20000, date: today, description: 'رصيد افتتاحي' }];
            }

            const collections = [
                'users', 'regularEmployees', 'products', 'customers', 'suppliers',
                'sales', 'purchases', 'transfers', 'expenses', 'cashbox', 'bank'
            ];
            collections.forEach(name => {
                normalized[name] = normalized[name].filter(
                    item => item && typeof item === 'object'
                );
            });
            if (normalized.users.length === 0) {
                normalized.users = [
                    { id: 1, name: 'صاحب الشركة', username: 'abo elsood', password: 'admin@2026', role: 'admin',
                        salary: 0, advances: 0, absences: 0 },
                    { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                        salary: 3000, advances: 0, absences: 0 }
                ];
            }

            normalized.users.forEach(user => {
                user.id = asNumber(user.id, nextId(normalized.users));
                user.name = String(user.name || 'موظف');
                user.username = String(user.username || '');
                user.role = user.role === 'admin' ? 'admin' : 'cashier';
                user.salary = asNumber(user.salary);
                user.advances = asNumber(user.advances);
                user.absences = asNumber(user.absences);
            });

            normalized.regularEmployees.forEach(employee => {
                employee.id = asNumber(employee.id, nextId(normalized.regularEmployees));
                employee.name = String(employee.name || 'موظف');
                employee.salary = asNumber(employee.salary);
                employee.advances = asNumber(employee.advances);
                employee.absences = asNumber(employee.absences);
            });

            normalized.products.forEach(product => {
                product.id = asNumber(product.id, nextId(normalized.products));
                product.code = String(product.code || `ITEM-${product.id}`);
                product.name = String(product.name || 'صنف');
                product.costPrice = asNumber(product.costPrice);
                product.sellPrice = asNumber(product.sellPrice);
                product.qty_main = Math.max(0, asNumber(product.qty_main));
                product.qty_matriya = Math.max(0, asNumber(product.qty_matriya));
            });

            normalized.customers.forEach(customer => {
                customer.id = asNumber(customer.id, nextId(normalized.customers));
                customer.name = String(customer.name || 'عميل');
                customer.phone = String(customer.phone || 'غير مسجل');
                customer.balance = asNumber(customer.balance);
            });

            normalized.suppliers.forEach(supplier => {
                supplier.id = asNumber(supplier.id, nextId(normalized.suppliers));
                supplier.name = String(supplier.name || 'مورد');
                supplier.phone = String(supplier.phone || 'غير مسجل');
                supplier.balance = asNumber(supplier.balance);
            });

            normalized.sales.forEach(sale => {
                sale.id = asNumber(sale.id, nextId(normalized.sales));
                sale.date = String(sale.date || today);
                sale.customerId = asNumber(sale.customerId);
                sale.customerName = String(sale.customerName || 'عميل');
                sale.customerPhone = String(sale.customerPhone || '');
                sale.items = Array.isArray(sale.items) ? sale.items : [];
                sale.items = sale.items.map(item => ({
                    ...item,
                    productId: asNumber(item.productId),
                    code: String(item.code || ''),
                    name: String(item.name || ''),
                    qty: Math.max(0, asNumber(item.qty)),
                    price: Math.max(0, asNumber(item.price)),
                    branch: item.branch === 'matriya' ? 'matriya' : 'main'
                }));
                sale.totalBefore = asNumber(sale.totalBefore, sale.items.reduce((sum, item) => sum + item.qty * item.price, 0));
                sale.discount = Math.max(0, asNumber(sale.discount));
                sale.totalAfter = asNumber(sale.totalAfter, Math.max(0, sale.totalBefore - sale.discount));
                sale.serialNumber = String(sale.serialNumber || `SL-${String(sale.id).padStart(6, '0')}`);
            });

            normalized.purchases.forEach(purchase => {
                purchase.id = asNumber(purchase.id, nextId(normalized.purchases));
                purchase.supplierId = asNumber(purchase.supplierId);
                purchase.supplierName = String(purchase.supplierName || 'مورد');
                purchase.date = String(purchase.date || today);
                purchase.invoiceNumber = String(purchase.invoiceNumber || `INV-${purchase.id}`);
                purchase.items = Array.isArray(purchase.items) ? purchase.items : [];
                purchase.items = purchase.items.map(item => ({
                    ...item,
                    code: String(item.code || ''),
                    name: String(item.name || ''),
                    qty: Math.max(0, asNumber(item.qty)),
                    buyPrice: Math.max(0, asNumber(item.buyPrice)),
                    sellPrice: Math.max(0, asNumber(item.sellPrice))
                }));
                purchase.totalCost = asNumber(purchase.totalCost, purchase.items.reduce(
                    (sum, item) => sum + asNumber(item.qty) * asNumber(item.buyPrice), 0
                ));
                purchase.itemCount = purchase.items.length;
                purchase.paid = asNumber(purchase.paid, 0);
                purchase.remaining = Math.max(0, purchase.totalCost - purchase.paid);
            });

            normalized.expenses.forEach(expense => {
                expense.id = asNumber(expense.id, nextId(normalized.expenses));
                expense.category = String(expense.category || 'أخرى');
                expense.description = String(expense.description || 'مصروف');
                expense.amount = Math.max(0, asNumber(expense.amount));
                expense.date = String(expense.date || today);
            });

            [...normalized.cashbox, ...normalized.bank].forEach(entry => {
                entry.id = asNumber(entry.id, 0);
                entry.amount = asNumber(entry.amount);
                entry.date = String(entry.date || today);
                entry.description = String(entry.description || '');
            });

            normalized.capital = normalized.capital && typeof normalized.capital === 'object'
                ? normalized.capital
                : { capitalAmount: 100000, setupCost: 15000, startDate: today };
            normalized.capital.capitalAmount = asNumber(normalized.capital.capitalAmount);
            normalized.capital.setupCost = asNumber(normalized.capital.setupCost);
            normalized.capital.startDate = String(normalized.capital.startDate || today);

            normalized.nextSaleId = Math.max(asNumber(normalized.nextSaleId), nextId(normalized.sales));
            normalized.nextPurchaseId = Math.max(asNumber(normalized.nextPurchaseId), nextId(normalized.purchases));
            normalized.nextTransferId = Math.max(asNumber(normalized.nextTransferId), nextId(normalized.transfers));
            normalized.nextExpId = Math.max(asNumber(normalized.nextExpId), nextId(normalized.expenses));
            normalized.nextCustId = Math.max(asNumber(normalized.nextCustId), nextId(normalized.customers));
            normalized.nextSuppId = Math.max(asNumber(normalized.nextSuppId), nextId(normalized.suppliers));
            normalized.nextRegEmpId = Math.max(asNumber(normalized.nextRegEmpId), nextId(normalized.regularEmployees));

            return normalized;
        }

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

                purchases: { roles: ['admin', 'cashier'] },

                expenses: { roles: ['admin', 'cashier'] },

            };
            
            if (!pageConfig[pageId] || !pageConfig[pageId].roles.includes(currentUser.role)) {
                main.innerHTML = '<h1>⚠️ غير مصرح لك بالوصول إلى هذه الصفحة</h1>';
                return;
            }
            
            switch (pageId) {
                case 'dashboard':

                    break;
                case 'inventory':

                    break;
                case 'sales':
                    renderSales(main);
                    break;

                    break;
                case 'purchases':

                    break;

                    break;
                case 'employees':
                    renderEmployees(main);
                    break;
                case 'expenses':
                    renderExpenses(main);
                    break;
                case 'finance':
                    renderFinance(main);
                    break;
                case 'reports':
                    renderReports(main);
                    break;

                    main.innerHTML = '<h1>صفحة غير موجودة</h1>';
            }
        }

        function addProduct() {
            if (currentUser.role !== 'admin') {
                alert('غير مصرح لك بإضافة أصناف');
                return;
            }
            const code = document.getElementById('pCode').value.trim();
            const name = document.getElementById('pName').value.trim();
            const cost = parseFloat(document.getElementById('pCost').value);
            const sell = parseFloat(document.getElementById('pSell').value);
            const qm = parseInt(document.getElementById('pQtyMain').value) || 0;
            const qmat = parseInt(document.getElementById('pQtyMat').value) || 0;
            if (!code || !name || !Number.isFinite(cost) || cost < 0 ||
                !Number.isFinite(sell) || sell < 0 || qm < 0 || qmat < 0) { 
                alert('يرجى ملء الكود والاسم والأسعار بشكل صحيح'); 
                return; 
            }
            if (db.products.find(p => p.code === code)) {
                alert('هذا الكود موجود بالفعل. يرجى استخدام كود مختلف');
                return;
            }
            db.products.push({ 
                id: nextId(db.products), 
                code, 
                name, 
                costPrice: cost, 
                sellPrice: sell, 
                qty_main: qm,
                qty_matriya: qmat 
            });
            saveDB(db);
            navigateTo('inventory');
            alert('✅ تم إضافة الصنف بنجاح');
        }

        function deleteProduct(id) {
            if (currentUser.role !== 'admin') {
                alert('غير مصرح لك بحذف أصناف');
                return;
            }
            if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
            db.products = db.products.filter(p => p.id !== id);
            saveDB(db);
            navigateTo('inventory');
        }

        function doTransfer() {
            if (currentUser.role !== 'admin') {
                alert('غير مصرح لك بنقل المخزون بين الفروع');
                return;
            }
            const pid = parseInt(document.getElementById('transferProduct').value);
            const qty = parseInt(document.getElementById('transferQty').value, 10);
            const from = document.getElementById('transferFrom').value;
            const to = document.getElementById('transferTo').value;
            if (!pid || !Number.isInteger(qty) || qty < 1) { alert('اختر الصنف والكمية الصحيحة'); return; }
            if (from === to) { alert('لا يمكن النقل لنفس الفرع'); return; }
            const prod = db.products.find(p => p.id === pid);
            if (!prod) return;
            if (from === 'main' && prod.qty_main < qty) { alert('الكمية غير كافية في الفرع الرئيسي'); return; }
            if (from === 'matriya' && prod.qty_matriya < qty) { alert('الكمية غير كافية في فرع المطرية'); return; }
            if (from === 'main') { 
                prod.qty_main -= qty;
                prod.qty_matriya += qty; 
            } else { 
                prod.qty_matriya -= qty;
                prod.qty_main += qty; 
            }
            db.transfers.push({ 
                id: db.nextTransferId++, 
                productId: pid, 
                qty, 
                from, 
                to, 
                date: new Date().toISOString().slice(0, 10) 
            });
            saveDB(db);
            navigateTo('inventory');
            alert('✅ تم نقل الكمية بنجاح');
        }

                            <div class="line"><span>الإجمالي قبل الخصم:</span><span id="totalBeforeDisplay">0.00</span></div>
                            <div class="line"><span>قيمة الخصم:</span><span id="discountDisplay">0.00</span></div>
                            <div class="line total"><span>الإجمالي النهائي:</span><span id="totalAfterDisplay">0.00</span></div>
                        </div>
                        <button class="btn btn-gold" onclick="saveSale()" style="width:100%; margin-top:10px;"><i class="fas fa-print"></i> حفظ وطباعة الفاتورة</button>
                    </div>
                </div>
            `;
            const selP = document.getElementById('saleProduct');
            db.products.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.code} - ${p.name} (المتبقي: ${p.qty_main + p.qty_matriya})`;
                selP.appendChild(opt);
            });
            selP.onchange = function() {
                const pid = parseInt(this.value);
                const prod = db.products.find(p => p.id === pid);
                if (prod) {
                    document.getElementById('salePrice').value = prod.sellPrice;
                } else {
                    document.getElementById('salePrice').value = 0;
                }
                updateSaleTotals();
            };
            selP.onchange();
            document.getElementById('custSelect').onchange = function() {
                if (this.value === 'new') { 
                    document.getElementById('custName').value = '';
                    document.getElementById('custPhone').value = ''; 
                } else {
                    const c = db.customers.find(c => c.id == this.value);
                    if (c) { 
                        document.getElementById('custName').value = c.name;
                        document.getElementById('custPhone').value = c.phone; 
                    }
                }
            };
            updateSaleTotals();
        }

        function updateSaleTotals() {
            const totalBefore = tempSaleItems.reduce((s, i) => s + (i.qty * i.price), 0);
            const discountInput = parseFloat(document.getElementById('discountVal').value);
            const discount = Number.isFinite(discountInput) ? Math.min(discountInput, totalBefore) : 0;
            const totalAfter = totalBefore - discount;

            document.getElementById('totalBeforeDisplay').textContent = totalBefore.toFixed(2);
            document.getElementById('discountDisplay').textContent = discount.toFixed(2);
            document.getElementById('totalAfterDisplay').textContent = totalAfter.toFixed(2);
        }

        function addSaleItem() {
            const pid = parseInt(document.getElementById('saleProduct').value);
            const qty = parseInt(document.getElementById('saleQty').value, 10);
            const price = parseFloat(document.getElementById('salePrice').value);
            const branch = document.getElementById('saleBranch').value;
            const prod = db.products.find(p => p.id === pid);
            if (!prod) {
                alert('الصنف غير موجود');
                return;
            }
            if (!Number.isInteger(qty) || qty < 1) {
                alert('الحجم (الكمية) يجب أن يكون رقماً صحيحاً أكبر من صفر');
                return;
            }
            if (!Number.isFinite(price) || price <= 0) {
                alert('سعر البيع يجب أن يكون أكبر من صفر');
                return;
            }
            const avail = branch === 'main' ? prod.qty_main : prod.qty_matriya;
            const alreadyAdded = tempSaleItems
                .filter(item => item.productId === pid && item.branch === branch)
                .reduce((sum, item) => sum + item.qty, 0);
            if (avail < alreadyAdded + qty) { 
                alert(`الكمية غير كافية في ${branch === 'main' ? 'الرئيسي' : 'المطرية'}. المتاح: ${avail}`); 
                return; 
            }
            tempSaleItems.push({ 
                productId: pid, 
                code: prod.code, 
                name: prod.name, 
                qty: qty,
                price: price, 
                branch: branch 
            });
            renderSalePreview();
            updateSaleTotals();
        }

        function renderSalePreview() {
            const div = document.getElementById('salePreview');
            if (tempSaleItems.length === 0) { 
                div.innerHTML = '<p style="color:rgba(255,255,255,0.3);">لم يتم إضافة أصناف</p>'; 
                return; 
            }
            let html = `<table><thead><tr><th>كود الصنف</th><th>نوع الزيت</th><th>الحجم</th><th>السعر</th><th>الإجمالي</th><th>الفرع</th><th>حذف</th></tr></thead><tbody>`;
            let total = 0;
            tempSaleItems.forEach((it, idx) => {
                const t = it.qty * it.price;
                total += t;
                html += `<tr><td>${it.code}</td><td>${it.name}</td><td>${it.qty}</td><td>${it.price}</td><td>${t.toFixed(2)}</td><td>${it.branch === 'main' ? 'رئيسي' : 'مطرية'}</td><td><button class="btn btn-danger btn-sm" onclick="removeSaleItem(${idx})"><i class="fas fa-times"></i></button></td></tr>`;
            });
            html += `<tr style="border-top:2px solid #f1c40f;"><td colspan="4">الإجمالي</td><td colspan="3">${total.toFixed(2)}</td></tr>`;
            html += `</tbody></table>`;
            div.innerHTML = html;
        }

        function removeSaleItem(idx) { 
            tempSaleItems.splice(idx, 1);

        }

        function saveSale() {
            if (tempSaleItems.length === 0) { 
                alert('أضف أصنافاً للفاتورة'); 
                return; 
            }

            const custSelect = document.getElementById('custSelect');
            let customerId = parseInt(custSelect.value);
            let custName = document.getElementById('custName').value.trim();
            let custPhone = document.getElementById('custPhone').value.trim();
            
            if (custSelect.value === 'new' || !customerId) {
                if (!custName) { 
                    alert('يرجى إدخال اسم العميل'); 
                    return; 
                }
            }

            const totalBefore = tempSaleItems.reduce((s, i) => s + (i.qty * i.price), 0);
            const discountInput = parseFloat(document.getElementById('discountVal').value);
            const discount = Number.isFinite(discountInput) ? Math.min(discountInput, totalBefore) : 0;
            const totalAfter = totalBefore - discount;

            const requiredStock = {};
            tempSaleItems.forEach(item => {
                const key = `${item.productId}_${item.branch}`;
                requiredStock[key] = (requiredStock[key] || 0) + item.qty;
            });
            for (const [key, required] of Object.entries(requiredStock)) {
                const [productId, branch] = key.split('_');
                const product = db.products.find(p => p.id === Number(productId));
                const available = product
                    ? (branch === 'main' ? product.qty_main : product.qty_matriya)
                    : 0;
                if (!product || available < required) {
                    alert('تغيرت الكمية المتاحة. راجع المخزون ثم حاول مرة أخرى');
                    return;
                }
            }

            let customer = db.customers.find(c => c.id === customerId);
            if (!customer && custSelect.value !== 'new') {
                alert('بيانات العميل غير موجودة');
                return;
            }
            if (!customer) {
                customer = {
                    id: db.nextCustId++,
                    name: custName,
                    phone: custPhone || 'غير مسجل',
                    balance: 0
                };
                db.customers.push(customer);
                customerId = customer.id;
            }
            custName = customer.name;
            custPhone = customer.phone || custPhone || 'غير مسجل';

            const saleId = db.nextSaleId++;
            const serialNumber = `SL-${String(saleId).padStart(6, '0')}`;

            const sale = {
                id: saleId,
                serialNumber: serialNumber,
                customerId,
                customerName: custName,
                customerPhone: custPhone,
                items: tempSaleItems.map(i => ({ 
                    productId: i.productId,
                    code: i.code,
                    name: i.name,
                    qty: i.qty,
                    price: i.price, 
                    branch: i.branch 
                })),
                discount: discount,
                totalBefore,
                totalAfter,
                date: new Date().toISOString().slice(0, 10),
                cashier: currentUser.name
            };
            
            db.sales.push(sale);
            
            sale.items.forEach(it => {
                const prod = db.products.find(p => p.id === it.productId);
                if (prod) {
                    if (it.branch === 'main') {
                        prod.qty_main = Math.max(0, prod.qty_main - it.qty);
                    } else {
                        prod.qty_matriya = Math.max(0, prod.qty_matriya - it.qty);
                    }
                }
            });
            
            if (totalAfter > 0) {
                db.cashbox.push({ 
                    id: nextId(db.cashbox), 
                    amount: totalAfter, 
                    date: sale.date,
                    description: `مبيعات فاتورة ${sale.id} - ${serialNumber}` 
                });
            }
            
            saveDB(db);
            printReceipt(sale);
            navigateTo('invoices');
            alert(`✅ تم حفظ الفاتورة رقم ${sale.id}\n📋 الرقم التسلسلي: ${serialNumber}`);
        }

        function savePurchase() {
            const sel = document.getElementById('suppSelect');
            let suppId = parseInt(sel.value);
            let name = document.getElementById('suppName').value.trim();
            let phone = document.getElementById('suppPhone').value.trim();
            let invoiceNumber = document.getElementById('invoiceNumber').value.trim() || `INV-${db.nextPurchaseId}`;
            let paidAmount = parseFloat(document.getElementById('purchasePaid').value) || 0;
            let newSupplier = null;
            
            if (sel.value === 'new' || !suppId) {
                if (!name) { 
                    alert('ادخل اسم المورد'); 
                    return; 
                }
                newSupplier = { 
                    id: db.nextSuppId++, 
                    name: name, 
                    phone: phone || 'غير مسجل', 
                    balance: 0 
                };
                suppId = newSupplier.id;
            } else {
                const supplier = db.suppliers.find(s => s.id === suppId);
                if (!supplier) {
                    alert('المورد غير موجود');
                    return;
                }
                name = supplier.name;
                phone = supplier.phone || 'غير مسجل';
            }
            
            const rows = document.querySelectorAll('#purchaseRowsContainer .row-item');
            let items = [];
            let totalCost = 0;
            let hasValidItem = false;
            
            rows.forEach(row => {
                const code = row.querySelector('.pCode').value.trim();
                const n = row.querySelector('.pName').value.trim();
                const q = parseInt(row.querySelector('.pQty').value, 10);
                const b = parseFloat(row.querySelector('.pBuy').value);
                const s = parseFloat(row.querySelector('.pSell').value);
                if (n && Number.isInteger(q) && q > 0 && Number.isFinite(b) && b > 0 &&
                    Number.isFinite(s) && s >= 0) {
                    hasValidItem = true;
                    const itemCode = code || `ITEM-${String(db.products.length + 1).padStart(3, '0')}`;
                    items.push({ code: itemCode, name: n, qty: q, buyPrice: b, sellPrice: s });
                    totalCost += b * q;
                    
                    let prod = db.products.find(p => p.name === n);
                    if (!prod) {
                        const productId = nextId(db.products);
                        db.products.push({ 
                            id: productId, 
                            code: itemCode, 
                            name: n,
                            costPrice: b, 
                            sellPrice: s, 
                            qty_main: q, 
                            qty_matriya: 0 
                        });
                    } else {
                        prod.costPrice = b;
                        prod.sellPrice = s;
                        prod.qty_main += q;
                        if (!prod.code || prod.code === '') {
                            prod.code = itemCode;
                        }
                    }
                }
            });
            
            if (!hasValidItem) { 
                alert('أضف صنفاً واحداً على الأقل مع بيانات صحيحة'); 
                return; 
            }

            if (paidAmount > totalCost) {
                alert('المبلغ المدفوع لا يمكن أن يتجاوز إجمالي الفاتورة');
                return;
            }

            if (newSupplier) {
                db.suppliers.push(newSupplier);
            }
            
            const purchase = {
                id: db.nextPurchaseId++, 
                supplierId: suppId, 
                supplierName: name, 
                invoiceNumber: invoiceNumber,
                items: items,
                itemCount: items.length,
                totalCost: totalCost,
                paid: paidAmount,
                remaining: totalCost - paidAmount,
                date: new Date().toISOString().slice(0, 10) 
            };
            
            db.purchases.push(purchase);
            
            const supplier = db.suppliers.find(s => s.id === suppId);
            if (supplier) {
                supplier.balance = (Number(supplier.balance) || 0) + totalCost;
            }
            
            if (paidAmount > 0) {
                db.cashbox.push({ 
                    id: nextId(db.cashbox), 
                    amount: -paidAmount, 
                    date: purchase.date,
                    description: `دفع للمورد ${name} - فاتورة ${invoiceNumber}` 
                });
            }
            
            saveDB(db);
            
            printSupplierInvoice(purchase);
            
            renderPurchases(document.getElementById('mainContent'));
            alert(`✅ تم حفظ التوريد\nرقم الفاتورة: ${invoiceNumber}\nعدد الأصناف: ${items.length}\nالمدفوع: ${paidAmount}\nالمتبقي: ${(totalCost - paidAmount).toFixed(2)}`);
        }

            if (search) {
                purchases = purchases.filter(p => 
                    String(p.id).includes(search) || 
                    p.supplierName.toLowerCase().includes(search) ||
                    p.invoiceNumber.toLowerCase().includes(search)

            if (currentUser.role !== 'admin') return;

                return; 
            }
            if (db.users.find(u => u.username === user)) { 
                alert('اسم المستخدم موجود بالفعل'); 
                return; 
            }
            db.users.push({
                id: nextId(db.users),
                name: name,
                username: user,
                password: pass,
                role: 'cashier',
                salary: salary,
                advances: 0,
                absences: 0
            });

            document.getElementById('empNameCashier').value = '';

        function calculatePayroll() {
            if (currentUser.role !== 'admin') return;
            const employeeSelect = document.getElementById('empPaySelect');
            if (!employeeSelect) {
                alert('تعذر تحميل قائمة الموظفين. أعد فتح صفحة الموظفين');
                return;
            }
            const val = employeeSelect.value;
            const advanceInput = parseFloat(document.getElementById('empAdvance').value);
            const absenceInput = parseInt(document.getElementById('empAbsence').value, 10);
            const advance = Number.isFinite(advanceInput) ? advanceInput : 0;
            const absence = Number.isFinite(absenceInput) ? absenceInput : 0;
            
            if (!val) { 
                alert('اختر موظفاً أولاً'); 
                return; 
            }
            if (advance < 0 || absence < 0) {
                alert('السلف وأيام الغياب لا يمكن أن تكون سالبة');
                return;
            }

            let emp = null;
            let type = '';
            const parts = val.split('_');
            
            if (parts[0] === 'cashier') {
                emp = db.users.find(u => u.id === parseInt(parts[1]));
                type = 'كاشير';
            } else if (parts[0] === 'regular') {
                emp = db.regularEmployees.find(e => e.id === parseInt(parts[1]));
                type = 'عادي';
            }

            if (!emp) { 
                alert('الموظف غير موجود'); 
                return; 
            }

            const salary = asNumber(emp.salary);
            const dailyRate = salary / 30;
            const absenceDeduction = absence * dailyRate;
            const totalDeduction = absenceDeduction + advance;
            const netSalary = Math.max(0, salary - totalDeduction);

            document.getElementById('payrollResult').innerHTML = `
                <p>الموظف: <strong>${emp.name}</strong> (${type})</p>
                 <p>الراتب الأساسي: ${salary.toFixed(2)}</p>
                <p>خصم الغياب (${absence} يوم): ${absenceDeduction.toFixed(2)}</p>
                <p>السلف: ${advance.toFixed(2)}</p>
                <p style="font-size:24px; font-weight:bold; color:#2ecc71;">صافي الراتب: ${netSalary.toFixed(2)}</p>
                <button class="btn btn-success" onclick="confirmPayroll('${val}', ${netSalary})"><i class="fas fa-check"></i> تأكيد صرف الراتب</button>
            `;
        }

        function confirmPayroll(val, net) {
            if (currentUser.role !== 'admin') return;
            const amount = asNumber(net);
            if (amount < 0) {
                alert('لا يمكن صرف راتب سالب');
                return;
            }
            
            const parts = val.split('_');
            let emp = null;
            if (parts[0] === 'cashier') {
                emp = db.users.find(u => u.id === parseInt(parts[1]));
            } else if (parts[0] === 'regular') {
                emp = db.regularEmployees.find(e => e.id === parseInt(parts[1]));
            }
            if (!emp) {
                alert('الموظف غير موجود أو تم حذفه');
                return;
            }
            emp.advances = 0;
            emp.absences = 0;
            
            db.cashbox.push({
                id: nextId(db.cashbox),
                amount: -amount,
                date: new Date().toISOString().slice(0, 10),
                description: `صرف راتب ${emp.name}`
            });
            
            saveDB(db);
            renderEmployeeList();
            fillPayrollSelect();
            document.getElementById('payrollResult').innerHTML = '';
            document.getElementById('empAdvance').value = '0';
            document.getElementById('empAbsence').value = '0';
            alert('✅ تم صرف الراتب بنجاح');
        }

                id: nextId(db.cashbox), 
                amount: -amount, 
                date: new Date().toISOString().slice(0, 10),
                description: `مصروف: ${desc}` 
            });
            
            saveDB(db);
            navigateTo('expenses');
            alert(`✅ تم تسجيل المصروف\n💰 تم خصم ${amount} من الصندوق`);
        }

        function renderExpensesTable() {
            const div = document.getElementById('expTable');
            if (!div) return;
            if (db.expenses.length === 0) { 
                div.innerHTML = '<p style="color:rgba(255,255,255,0.3);">لا توجد مصروفات</p>'; 
                return; 
            }
            let html = `<table><thead><tr><th>التصنيف</th><th>البيان</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>`;
            db.expenses.slice().reverse().forEach(e => {
                html += `<tr><td>${e.category}</td><td>${e.description}</td><td>${e.amount}</td><td>${e.date}</td></tr>`;
            });
            html += `</tbody></table>`;
            div.innerHTML = html;
        }

        // ================================================================
        // 13. المالية - مع التحكم الكامل + تصفير مصاريف التأسيس
        // ================================================================
        function renderFinance(container) {
            if (currentUser.role !== 'admin') {
                container.innerHTML = '<h1>⚠️ غير مصرح لك بالوصول إلى هذه الصفحة</h1>';
                return;
            }
            const cap = db.capital;
            const months = (new Date().getFullYear() - new Date(cap.startDate).getFullYear()) * 12 + (new Date()
                .getMonth() - new Date(cap.startDate).getMonth());
            const depreciationMonthly = cap.setupCost / (5 * 12);
            const elapsedMonths = Math.max(0, Math.min(months, 60));
            const totalDepreciation = elapsedMonths * depreciationMonthly;
            const remainingSetup = Math.max(0, cap.setupCost - totalDepreciation);
            const totalCash = db.cashbox.reduce((a, b) => a + asNumber(b.amount), 0);
            const totalBank = db.bank.reduce((a, b) => a + asNumber(b.amount), 0);

            container.innerHTML = `
                <div class="page active">
                    <div class="page-header"><h1><i class="fas fa-landmark"></i> المالية</h1><p>رأس المال - الإهلاك - البنك - الصندوق - مصاريف التأسيس</p></div>
                    
                    <div class="card-panel border-red">
                        <h3><i class="fas fa-exclamation-triangle"></i> إعادة تعيين الأرصدة</h3>
                        <p style="color:rgba(255,255,255,0.5);">⚠️ تحذير: سيتم مسح جميع أرصدة البنك والصندوق والمصروفات والتوريدات</p>
                        <button class="btn btn-danger" onclick="resetAllBalances()"><i class="fas fa-trash"></i> مسح كل الأرصدة وبدء من الصفر</button>
                    </div>

                    <div class="cards-grid">
                        <div class="stat-card"><h4>💰 رأس المال</h4><div class="number">${cap.capitalAmount.toFixed(2)}</div>
                            <div class="sub"><input id="editCapital" type="number" value="${cap.capitalAmount}" style="width:100px; padding:5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:#fff;">
                            <button class="btn btn-sm btn-gold" onclick="updateCapital()">تحديث</button></div>
                        </div>
                        <div class="stat-card"><h4>🏦 رصيد البنك</h4><div class="number">${totalBank.toFixed(2)}</div>
                            <div class="sub"><input id="editBank" type="number" value="${totalBank}" style="width:100px; padding:5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:#fff;">
                            <button class="btn btn-sm btn-gold" onclick="updateBankBalance()">تحديث</button></div>
                        </div>
                        <div class="stat-card"><h4>💵 رصيد الصندوق</h4><div class="number">${totalCash.toFixed(2)}</div>
                            <div class="sub"><input id="editCash" type="number" value="${totalCash}" style="width:100px; padding:5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:#fff;">
                            <button class="btn btn-sm btn-gold" onclick="updateCashBalance()">تحديث</button></div>
                        </div>
                        <div class="stat-card" style="border-color:#e74c3c;"><h4>📉 مصاريف التأسيس</h4>
                            <div class="number" style="color:#e74c3c;">${cap.setupCost.toFixed(2)}</div>
                            <div class="sub">المتبقي: ${remainingSetup.toFixed(2)}</div>
                            <div style="margin-top:10px;">
                                <input id="editSetupCost" type="number" value="${cap.setupCost}" style="width:80px; padding:5px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:#fff;">
                                <button class="btn btn-sm btn-warning" onclick="updateSetupCost()">تحديث</button>
                                <button class="btn btn-sm btn-danger" onclick="resetSetupCost()"><i class="fas fa-undo"></i> تصفير</button>
                            </div>
                        </div>
                    </div>

                    <div class="card-panel">
                        <h3><i class="fas fa-chart-line"></i> حساب الأرباح والخسائر</h3>
                        <p>إجمالي المبيعات الكلي: ${db.sales.reduce((a,b)=>a+b.totalAfter,0).toFixed(2)}</p>
                        <p>إجمالي المصروفات: ${db.expenses.reduce((a,b)=>a+b.amount,0).toFixed(2)}</p>
                        <p>إجمالي الإهلاك الشهري: ${depreciationMonthly.toFixed(2)} (تم احتساب ${elapsedMonths} شهر)</p>
                        <hr>
                        <p style="font-size:20px; color:#f1c40f;">صافي الربح = ${(db.sales.reduce((a,b)=>a+b.totalAfter,0) - db.expenses.reduce((a,b)=>a+b.amount,0) - totalDepreciation).toFixed(2)}</p>
                    </div>

                    <div class="card-panel">
                        <h3><i class="fas fa-university"></i> سجل حركة البنك</h3>
                        <div class="table-responsive"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead>
                        <tbody>${db.bank.slice().reverse().map(b => `
                            <tr><td>${b.date}</td><td>${b.description}</td><td style="color:${b.amount >= 0 ? '#2ecc71' : '#e74c3c'}">${b.amount >= 0 ? '+' : ''}${b.amount.toFixed(2)}</td></tr>
                        `).join('')}</tbody></table></div>
                    </div>

                    <div class="card-panel">
                        <h3><i class="fas fa-money-bill"></i> سجل حركة الصندوق</h3>
                        <div class="table-responsive"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead>
                        <tbody>${db.cashbox.slice().reverse().map(c => `
                            <tr><td>${c.date}</td><td>${c.description}</td><td style="color:${c.amount >= 0 ? '#2ecc71' : '#e74c3c'}">${c.amount >= 0 ? '+' : ''}${c.amount.toFixed(2)}</td></tr>
                        `).join('')}</tbody></table></div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        // دوال التحكم في المالية
        // ================================================================

        function updateCapital() {
            const val = parseFloat(document.getElementById('editCapital').value);
            if (!Number.isFinite(val) || val < 0) { alert('ادخل قيمة صحيحة'); return; }
            db.capital.capitalAmount = val;
            saveDB(db);
            navigateTo('finance');
            alert('✅ تم تحديث رأس المال');
        }

        function updateBankBalance() {
            const val = parseFloat(document.getElementById('editBank').value);
            if (!Number.isFinite(val) || val < 0) { alert('ادخل قيمة صحيحة'); return; }
            const currentTotal = db.bank.reduce((a, b) => a + asNumber(b.amount), 0);
            const diff = val - currentTotal;
            db.bank.push({
                id: nextId(db.bank),
                amount: diff,
                date: new Date().toISOString().slice(0, 10),
                description: `تعديل يدوي للرصيد`
            });
            saveDB(db);
            navigateTo('finance');
            alert(`✅ تم تحديث رصيد البنك`);
        }

        function updateCashBalance() {
            const val = parseFloat(document.getElementById('editCash').value);
            if (!Number.isFinite(val) || val < 0) { alert('ادخل قيمة صحيحة'); return; }
            const currentTotal = db.cashbox.reduce((a, b) => a + asNumber(b.amount), 0);
            const diff = val - currentTotal;
            db.cashbox.push({
                id: nextId(db.cashbox),
                amount: diff,
                date: new Date().toISOString().slice(0, 10),
                description: `تعديل يدوي للرصيد`
            });
            saveDB(db);
            navigateTo('finance');
            alert(`✅ تم تحديث رصيد الصندوق`);
        }

        function updateSetupCost() {
            const val = parseFloat(document.getElementById('editSetupCost').value);
            if (!Number.isFinite(val) || val < 0) { alert('ادخل قيمة صحيحة (0 أو أكثر)'); return; }
            db.capital.setupCost = val;
            saveDB(db);
            navigateTo('finance');
            alert(`✅ تم تحديث مصاريف التأسيس إلى ${val}`);
        }

        function resetSetupCost() {
            if (!confirm('⚠️ هل أنت متأكد من تصفير مصاريف التأسيس (جعلها صفر)؟')) return;
            db.capital.setupCost = 0;
            saveDB(db);
            navigateTo('finance');
            alert('✅ تم تصفير مصاريف التأسيس بنجاح (أصبحت 0)');
        }

        function resetAllBalances() {
            if (!confirm('⚠️ تحذير: هل أنت متأكد من مسح كل الأرصدة والبدء من الصفر؟')) return;
            if (!confirm('تأكيد نهائي: سيتم حذف كل حركات البنك والصندوق والمصروفات والتوريدات')) return;
            
            db.bank = [];
            db.cashbox = [];
            db.expenses = [];
            db.purchases = [];
            db.nextExpId = 1;
            db.nextPurchaseId = 1;
            
            db.bank.push({ id: 1, amount: 0, date: new Date().toISOString().slice(0, 10), description: 'رصيد افتتاحي (صفر)' });
            db.cashbox.push({ id: 1, amount: 0, date: new Date().toISOString().slice(0, 10), description: 'رصيد افتتاحي (صفر)' });
            
            saveDB(db);
            navigateTo('finance');
            alert('✅ تم مسح كل الأرصدة والبدء من الصفر');
        }

        // ================================================================
        // 14. التقارير (للأدمن فقط)
        // ================================================================
        function renderReports(container) {
            if (currentUser.role !== 'admin') {
                container.innerHTML = '<h1>⚠️ غير مصرح لك بالوصول إلى هذه الصفحة</h1>';
                return;
            }
            container.innerHTML = `
                <div class="page active">
                    <div class="page-header"><h1><i class="fas fa-file-alt"></i> التقارير الشاملة</h1><p>يومي - شهري - سنوي - تصدير Excel</p></div>
                    <div class="card-panel">
                        <div style="display:flex; gap:15px; flex-wrap:wrap;">
                            <button class="btn btn-gold" onclick="generateReport('daily')"><i class="fas fa-calendar-day"></i> تقرير اليوم</button>
                            <button class="btn btn-success" onclick="generateReport('monthly')"><i class="fas fa-calendar-alt"></i> تقرير الشهر</button>
                            <button class="btn btn-primary" onclick="generateReport('yearly')"><i class="fas fa-calendar-year"></i> تقرير السنة</button>
                            <button class="btn btn-warning" onclick="exportFullExcel()"><i class="fas fa-file-excel"></i> تصدير Excel شامل</button>
                        </div>
                    </div>
                    <div class="card-panel"><h3>نتيجة التقرير</h3><div id="reportResult"></div></div>
                </div>
            `;
        }

        function generateReport(type) {
            if (currentUser.role !== 'admin') return;
            const div = document.getElementById('reportResult');
            let filtered = [];
            const now = new Date();
            const today = now.toISOString().slice(0, 10);
            const month = today.slice(0, 7);
            const year = today.slice(0, 4);

            if (type === 'daily') filtered = db.sales.filter(s => s.date === today);
            else if (type === 'monthly') filtered = db.sales.filter(s => s.date.startsWith(month));
            else filtered = db.sales.filter(s => s.date.startsWith(year));

            const total = filtered.reduce((a, b) => a + b.totalAfter, 0);
            const count = filtered.length;
            
            const expenses = db.expenses.filter(e => {
                if (type === 'daily') return e.date === today;
                if (type === 'monthly') return e.date.startsWith(month);
                return e.date.startsWith(year);
            });
            const totalExp = expenses.reduce((a, b) => a + b.amount, 0);

            div.innerHTML = `
                <p><strong>الفترة:</strong> ${type === 'daily' ? today : type === 'monthly' ? month : year}</p>
                <p>عدد الفواتير: ${count}</p>
                <p>إجمالي المبيعات: ${total.toFixed(2)}</p>
                <p>إجمالي المصروفات: ${totalExp.toFixed(2)}</p>
                <p style="font-size:20px; color:#f1c40f;">صافي الربح: ${(total - totalExp).toFixed(2)}</p>
            `;
        }

        function exportFullExcel() {
            if (currentUser.role !== 'admin') return;
            try {
                const wb = XLSX.utils.book_new();
                
                const salesData = db.sales.map(s => ({ 
                    'رقم الفاتورة': s.id,
                    'الرقم التسلسلي': s.serialNumber || `SL-${String(s.id).padStart(6, '0')}`,
                    'العميل': s.customerName, 
                    'التاريخ': s.date, 
                    'الإجمالي': s.totalAfter, 
                    'الخصم': s.discount,
                    'الكاشير': s.cashier || ''
                }));
                const s1 = XLSX.utils.json_to_sheet(salesData);
                XLSX.utils.book_append_sheet(wb, s1, 'المبيعات');

                const purchasesData = db.purchases.map(p => ({ 
                    'رقم الفاتورة': p.invoiceNumber || 'بدون رقم',
                    'المورد': p.supplierName, 
                    'عدد الأصناف': p.itemCount || p.items.length,
                    'التاريخ': p.date, 
                    'الإجمالي': p.totalCost,
                    'المدفوع': p.paid || 0,
                    'المتبقي': p.remaining || p.totalCost
                }));
                const s2 = XLSX.utils.json_to_sheet(purchasesData);
                XLSX.utils.book_append_sheet(wb, s2, 'التوريدات');

                const expensesData = db.expenses.map(e => ({ 
                    'التصنيف': e.category, 
                    'البيان': e.description, 
                    'المبلغ': e.amount, 
                    'التاريخ': e.date 
                }));
                const s3 = XLSX.utils.json_to_sheet(expensesData);
                XLSX.utils.book_append_sheet(wb, s3, 'المصروفات');

                const productsData = db.products.map(p => ({ 
                    'الكود': p.code, 
                    'الاسم': p.name, 
                    'الرئيسي': p.qty_main, 
                    'المطرية': p.qty_matriya, 
                    'سعر التكلفة': p.costPrice, 
                    'سعر البيع': p.sellPrice 
                }));
                const s4 = XLSX.utils.json_to_sheet(productsData);
                XLSX.utils.book_append_sheet(wb, s4, 'المخزون');

                const customersData = db.customers.map(c => ({ 
                    'العميل': c.name, 
                    'التلفون': c.phone, 
                    'الرصيد': c.balance 
                }));
                const s5 = XLSX.utils.json_to_sheet(customersData);
                XLSX.utils.book_append_sheet(wb, s5, 'العملاء');

                const employeesData = [];
                db.users.filter(u => u.role === 'cashier').forEach(u => {
                    employeesData.push({ 'الاسم': u.name, 'النوع': 'كاشير', 'الراتب': u.salary, 'السلف': u.advances, 'الغياب': u.absences });
                });
                db.regularEmployees.forEach(e => {
                    employeesData.push({ 'الاسم': e.name, 'النوع': 'عادي', 'الراتب': e.salary, 'السلف': e.advances, 'الغياب': e.absences });
                });
                const s6 = XLSX.utils.json_to_sheet(employeesData);
                XLSX.utils.book_append_sheet(wb, s6, 'الموظفين');

                XLSX.writeFile(wb, `تقرير_ابوالسعود_${new Date().toISOString().slice(0,10)}.xlsx`);
                alert('✅ تم تصدير Excel الشامل بنجاح');
            } catch (error) {
                alert('حدث خطأ أثناء تصدير Excel: ' + error.message);
            }
        }

        // ================================================================
        // 15. طباعة الفاتورة
        // ================================================================
        function printReceipt(sale) {
            document.getElementById('rInvoiceNo').innerText = sale.id;
            document.getElementById('rSerialNo').innerText = sale.serialNumber || `SL-${String(sale.id).padStart(6, '0')}`;
            document.getElementById('rDate').innerText = sale.date || new Date().toISOString().slice(0, 10);
            document.getElementById('rCustomer').innerText = sale.customerName || 'عميل';
            document.getElementById('rPhone').innerText = sale.customerPhone || '';
            
            let html = '';
            if (sale.items && sale.items.length > 0) {
                sale.items.forEach(it => {
                    const prod = db.products.find(p => p.id === it.productId);
                    const itemCode = it.code || (prod ? prod.code : '');
                    const itemName = it.name || (prod ? prod.name : 'صنف غير معروف');
                    html += `<tr><td>${itemCode}</td><td>${itemName}</td><td>${it.qty}</td><td>${it.price.toFixed(2)}</td><td>${(it.qty*it.price).toFixed(2)}</td></tr>`;
                });
            } else {
                html += `<tr><td colspan="5" style="text-align:center;">لا توجد أصناف</td></tr>`;
            }
            document.getElementById('rItems').innerHTML = html;
            document.getElementById('rTotalBefore').innerText = (sale.totalBefore || 0).toFixed(2);
            document.getElementById('rDiscount').innerText = (sale.discount || 0).toFixed(2);
            document.getElementById('rTotalAfter').innerText = (sale.totalAfter || 0).toFixed(2);
            
            setTimeout(() => {
                window.print();
            }, 300);
        }

        // ================================================================
        // 16. تسجيل الخروج
        // ================================================================
        function logout() {
            if (!confirm('تسجيل الخروج؟')) return;
            currentUser = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
        }

        // ================================================================
        // 17. أحداث إضافية
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') {
                handleLogin();
            }
        });

        console.log('🚀 النظام المتكامل v6.1 - تحكم كامل في المالية وتصفير مصاريف التأسيس');
        console.log('📊 قاعدة البيانات تحتوي على:', {
            users: db.users.length,
            products: db.products.length,
            customers: db.customers.length,
            suppliers: db.suppliers.length,
            sales: db.sales.length,
            purchases: db.purchases.length,
            expenses: db.expenses.length
        });
    </script>
</body>
